[project]
name = "klar"
version = "0.1.0"
description = "Klar - a call intelligence pipeline on the ElevenLabs API (Scribe v2 + LLM extraction)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anna Nikolaides" }]
dependencies = [
  "elevenlabs>=1.0.0",
  "anthropic>=0.40.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
klar = "klar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
